# A minimal maturin (Rust/PyO3) package: the fixture wads' native-selftest workflow builds
# through the same actions the reusable workflow's native path uses (i2mint/wads#166).
# Not published; not part of the wads distribution.
[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "wads-native-fixture"
version = "0.0.1"
description = "Fixture for wads' native wheel path"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
manifest-path = "rust/py/Cargo.toml"
module-name = "wads_native_fixture._core"
bindings = "pyo3"
