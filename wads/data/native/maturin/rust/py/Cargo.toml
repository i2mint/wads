[package]
name = "tmpl-pkg-py"
description = "Python bindings for tmpl_pkg, built by maturin as tmpl_pkg._core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "_core"            # must match the last part of [tool.maturin] module-name
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
tmpl-pkg-core = { path = "../core" }

[lints]
workspace = true
