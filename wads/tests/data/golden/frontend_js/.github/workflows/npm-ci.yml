# wads NPM CI — calls the reusable workflow hosted in i2mint/wads.
#
# All configuration lives in js/package.json under the "wads"
# key (wads.ci.*). This workflow only runs when the JS subdirectory changes,
# so it never collides with the Python ci.yml.
#
# Publishing to npm is OPT-IN: set wads.ci.publish.enabled=true in package.json
# and include the marker (default "[publish-npm]") in your commit message.
# Publishing uses OIDC trusted publishing by default (configure the trusted
# publisher for this repo + workflow filename on npmjs.com). NPM_TOKEN is only
# needed as a fallback (e.g. the very first publish of a new package name).
#
# On-demand CI (opt-in, mirrors [tool.wads.ci.trigger] on the Python side):
# set wads.ci.trigger.mode="on-demand" in package.json and the reusable
# workflow's validate/publish jobs run only when the commit SUBJECT contains
# wads.ci.trigger.runCiMarker (default "[run ci]"), or the run is a manual
# `gh workflow run npm-ci.yml --ref <branch>` (always allowed).
# To do locally what CI would have done: `npm run ci-local` (lint, test,
# build — add that script to package.json if it isn't there already).
name: NPM CI
on:
  push:
    paths:
      - "js/**"
      - ".github/workflows/npm-ci.yml"
  pull_request:
    paths:
      - "js/**"
jobs:
  npm-ci:
    uses: i2mint/wads/.github/workflows/npm-ci.yml@master
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC trusted publishing
    with:
      package-dir: js
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
