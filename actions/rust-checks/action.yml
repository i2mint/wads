name: "Rust checks"
description: >-
  cargo fmt --check, cargo clippy with warnings denied, and cargo test on the pure-Rust
  crates of a native (maturin) package (issue #166). Run after setup-rust.

inputs:
  project-dir:
    description: "Directory holding pyproject.toml and the Cargo workspace"
    required: false
    default: "."
  manifest-path:
    description: >-
      The binding crate's Cargo.toml, relative to project-dir ([tool.maturin].manifest-path);
      cargo finds its workspace from there, so the workspace need not sit at project-dir.
    required: false
    default: "Cargo.toml"
  cargo-test-args:
    description: >-
      JSON list of `cargo test` arguments ([] skips the tests). Empty or "null": every
      workspace crate except the binding one maturin builds, from cargo metadata.
    required: false
    default: ""
  deny:
    description: >-
      "auto" (default): run `cargo deny check` (licences, advisories, bans, sources) when the
      Cargo workspace has a deny.toml; "false": never (issue #223).
    required: false
    default: "auto"
  deny-version:
    description: "cargo-deny release to install (a prebuilt binary, not compiled)"
    required: false
    default: "0.19.9"

runs:
  using: "composite"
  steps:
    - name: cargo fmt
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        MANIFEST: ${{ inputs.manifest-path }}
      run: cargo fmt --all --check --manifest-path "$MANIFEST"

    - name: cargo clippy
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        MANIFEST: ${{ inputs.manifest-path }}
      run: cargo clippy --manifest-path "$MANIFEST" --workspace --all-targets -- -D warnings

    - name: cargo test
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        CARGO_TEST_ARGS: ${{ inputs.cargo-test-args }}
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        set -e
        if [ -z "$CARGO_TEST_ARGS" ] || [ "$CARGO_TEST_ARGS" = "null" ]; then
          ARGS=$(cargo metadata --manifest-path "$MANIFEST" --no-deps --format-version 1 \
            | python3 -I "$GITHUB_ACTION_PATH/../../wads/scripts/cargo_test_args.py" "$MANIFEST")
          read -ra args <<< "$ARGS"
        else
          mapfile -t args < <(python3 -I -c 'import json, os; print("\n".join(json.loads(os.environ["CARGO_TEST_ARGS"])))')
        fi
        if [ "${#args[@]}" -eq 0 ]; then
          echo "No pure-Rust crate to test (the binding crate is tested through Python)."
          exit 0
        fi
        echo "Running: cargo test ${args[*]}"
        cargo test --manifest-path "$MANIFEST" "${args[@]}"

    - name: Look for a deny.toml
      id: deny
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        DENY: ${{ inputs.deny }}
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        set -e
        [ "$DENY" = "false" ] && { echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; }
        root=$(cargo metadata --manifest-path "$MANIFEST" --no-deps --format-version 1 \
          | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["workspace_root"])')
        if [ -f "$root/deny.toml" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "config=$root/deny.toml" >> "$GITHUB_OUTPUT"
        else
          echo "No deny.toml in $root: skipping cargo deny."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install cargo-deny
      if: steps.deny.outputs.present == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny@${{ inputs.deny-version }}

    - name: cargo deny
      if: steps.deny.outputs.present == 'true'
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        MANIFEST: ${{ inputs.manifest-path }}
        CONFIG: ${{ steps.deny.outputs.config }}
      run: cargo deny --manifest-path "$MANIFEST" check --config "$CONFIG"
