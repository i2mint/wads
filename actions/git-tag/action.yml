name: "Git Tag"
description: "Tag repository and push tag to remote - modern, dependency-free"

inputs:
  tag:
    description: "Tag name (e.g., version number)"
    required: true
  message:
    description: "Tag message (creates annotated tag if provided)"
    required: false
  push:
    description: "Push tag to remote after creating"
    required: false
    default: "true"
  force:
    description: "Force create tag (overwrites existing tag)"
    required: false
    default: "false"

  push-retries:
    description: >-
      How many times to retry a rejected tag push. Right after the version-bump
      push, GitHub can reject the tag with "missing necessary objects" for a
      few hundred milliseconds (i2mint/wads#122); a short retry rides it out.
      0 restores the historical single attempt.
    required: false
    default: "3"
  push-retry-delay:
    description: "Seconds before the first retry; each later retry waits that much longer (linear backoff)."
    required: false
    default: "2"

runs:
  using: 'composite'
  steps:
    - name: Create Tag
      shell: bash
      run: |
        set -e

        tag_args=""

        if [ "${{ inputs.force }}" = "true" ]; then
          tag_args="$tag_args -f"
        fi

        if [ -n "${{ inputs.message }}" ]; then
          echo "Creating annotated tag: ${{ inputs.tag }}"
          git tag $tag_args -a "${{ inputs.tag }}" -m "${{ inputs.message }}"
        else
          echo "Creating lightweight tag: ${{ inputs.tag }}"
          git tag $tag_args "${{ inputs.tag }}"
        fi

        echo "Tag created: ${{ inputs.tag }}"

    - name: Push Tag
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        TAG_MESSAGE: ${{ inputs.message }}
        FORCE: ${{ inputs.force }}
        PUSH_RETRIES: ${{ inputs.push-retries }}
        PUSH_RETRY_DELAY: ${{ inputs.push-retry-delay }}
      run: |
        set -eo pipefail

        push_args=()
        if [ "$FORCE" = "true" ]; then
          push_args+=(--force)
        fi
        retries="${PUSH_RETRIES:-3}"
        delay="${PUSH_RETRY_DELAY:-2}"
        local_obj=$(git rev-parse "refs/tags/$TAG")

        # Retried because the tag push can fail transiently right after the bump
        # commit it points at was pushed: GitHub answered "missing necessary
        # objects" ~50 ms after accepting that commit, so the release reached
        # PyPI with no tag and the run went red (i2mint/wads#122).
        attempt=0
        while true; do
          echo "Pushing tag to remote: $TAG"
          if git push "${push_args[@]}" origin "refs/tags/$TAG"; then
            exit 0
          fi
          # A push that reported failure may still have landed (or a retry
          # raced a previous attempt): the same tag object on the remote is done.
          remote_obj=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$remote_obj" ] && [ "$remote_obj" = "$local_obj" ]; then
            echo "Tag $TAG is already on the remote at the same object."
            exit 0
          fi

          attempt=$((attempt + 1))
          if [ "$attempt" -gt "$retries" ]; then
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ -n "$TAG_MESSAGE" ]; then
              restore=$(printf 'git tag -a %q %q -m %q && git push origin %q' "$TAG" "$commit" "$TAG_MESSAGE" "refs/tags/$TAG")
            else
              restore=$(printf 'git tag %q %q && git push origin %q' "$TAG" "$commit" "refs/tags/$TAG")
            fi
            echo "::error::Push of tag '$TAG' was rejected after $retries retr(y/ies). The release has no tag; restore it from a clone with: $restore"
            exit 1
          fi
          wait_s=$((delay * attempt))
          echo "Tag push rejected; retrying in ${wait_s}s ($attempt/$retries)."
          sleep "$wait_s"
        done
