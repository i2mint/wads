name: Install System Dependencies
description: 'Install system dependencies from [tool.wads.ops.*] in pyproject.toml'

inputs:
  pyproject-path:
    description: 'Path to pyproject.toml file or directory containing it'
    required: false
    default: '.'
  platform:
    description: 'Platform to install for (linux, macos, windows). Auto-detected if not specified.'
    required: false
  skip-check:
    description: 'Skip checking if dependencies are already installed'
    required: false
    default: 'false'
  install-timeout:
    description: 'Per-command install timeout in seconds for dependencies that declare no install_timeout of their own. Empty keeps the installer default (300; 900 for ffmpeg).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name:  Ensure tomli is installed (Python < 3.11)
      shell: bash
      run: |
        if python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)"; then
          echo "Python 3.11+, tomllib available"
        else
          echo "Python < 3.11, installing tomli"
          python3 -m pip install --quiet tomli
        fi
    
    - name: Install System Dependencies from pyproject.toml
      shell: bash
      run: |
        echo "::group::Installing system dependencies"

        # Build arguments
        ARGS="${{ inputs.pyproject-path }}"

        if [ -n "${{ inputs.platform }}" ]; then
          ARGS="$ARGS --platform ${{ inputs.platform }}"
        fi

        if [ "${{ inputs.skip-check }}" = "true" ]; then
          ARGS="$ARGS --skip-check"
        fi

        # Only appended when set (an empty value would break the flag).
        if [ -n "${{ inputs.install-timeout }}" ]; then
          ARGS="$ARGS --install-timeout ${{ inputs.install-timeout }}"
        fi

        # Run the installer as a script from this action's own checkout, not from a PyPI
        # wheel: a fix merged here would otherwise be shadowed by whichever wads release
        # pip resolves. As a script (not -m) it skips wads/__init__, which needs
        # `packaging` and friends that a bare runner Python lacks.
        python3 "$GITHUB_ACTION_PATH/../../wads/install_system_deps.py" $ARGS

        EXIT_CODE=$?
        echo "::endgroup::"
        exit $EXIT_CODE
