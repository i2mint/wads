name: "Publish crates"
description: >-
  Publish Rust crates to crates.io with `cargo publish -p <crate> --locked`, in the order given,
  skipping a crate version that is already on crates.io (so a re-run is safe). With dry-run
  "true" it runs `cargo publish --dry-run` instead and needs no token. The crates and the
  workspace directory come from [tool.wads.ci.build.native] publish_crates / crates_dir
  (wads#211). The token is read from the environment by cargo and never echoed.

inputs:
  crates:
    description: "JSON list of crate names, in publish order (dependencies first)"
    required: true
  crates-dir:
    description: "Directory of the Cargo workspace, relative to the repo root"
    required: false
    default: "."
  dry-run:
    description: '"true" to run `cargo publish --dry-run` (no token, no upload)'
    required: false
    default: "false"
  registry-token:
    description: "crates.io API token (the CARGO_REGISTRY_TOKEN secret); required unless dry-run"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: cargo publish
      shell: bash
      working-directory: ${{ inputs.crates-dir }}
      env:
        CRATES: ${{ inputs.crates }}
        DRY_RUN: ${{ inputs.dry-run }}
        CARGO_REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -eu
        set +x
        if [ "$DRY_RUN" != "true" ] && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is empty. Set the secret (an empty one fails crates.io with 'please provide a non-empty token' while 'gh secret set' still reports success) and pass it in the stub's secrets."
          exit 1
        fi
        meta="$(cargo metadata --no-deps --format-version 1)"
        for crate in $(python3 -I -c 'import json,os; print(" ".join(json.loads(os.environ["CRATES"])))'); do
          version="$(printf '%s' "$meta" | python3 -I -c 'import json,sys; n=sys.argv[1]; print(next((p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]==n), ""))' "$crate")"
          if [ -z "$version" ]; then
            echo "::error::crate '$crate' is not in the Cargo workspace"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'wads-publish-crates' "https://crates.io/api/v1/crates/$crate/$version")"
          if [ "$code" = "200" ]; then
            echo "$crate $version is already on crates.io: skipping"
            continue
          fi
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish -p "$crate" --locked --dry-run
          else
            echo "Publishing $crate $version"
            cargo publish -p "$crate" --locked
          fi
        done
