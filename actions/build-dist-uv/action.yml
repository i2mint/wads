name: "Build Distribution (uv)"
description: "Build Python distribution packages using uv"

inputs:
  sdist:
    description: "Build source distribution"
    required: false
    default: "true"
  wheel:
    description: "Build wheel distribution"
    required: false
    default: "true"

runs:
  using: 'composite'
  steps:
    - name: Build Distribution
      shell: bash
      run: |
        set -e
        # `uv build` builds both by default and has no flag to exclude one; it
        # takes --sdist or --wheel to build only that one. (wads.ci_local's
        # uv_build_args mirrors this mapping for `wads ci-local`.)
        BUILD_ARGS=""
        if [ "${{ inputs.sdist }}" = "false" ] && [ "${{ inputs.wheel }}" = "false" ]; then
          echo "::error::[tool.wads.ci.build] disables both sdist and wheel: nothing to build"
          exit 1
        elif [ "${{ inputs.sdist }}" = "false" ]; then
          BUILD_ARGS="--wheel"
        elif [ "${{ inputs.wheel }}" = "false" ]; then
          BUILD_ARGS="--sdist"
        fi
        uv build $BUILD_ARGS
        echo "Built distributions:"
        ls -la dist/
