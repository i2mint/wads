name: "Pin Self Refs"
description: >-
  Make the commit to tag for a release: the built commit with this repo's
  references to its own actions and workflows (uses: OWNER/REPO/...@<default
  branch>) pinned to the release version, so a caller pinned to the tag runs the
  actions of that release (i2mint/wads#170). The new commit is reachable only
  through the tag. A repo with no such references gets the built commit back.

inputs:
  version:
    description: "The release version (the tag name)."
    required: true
  ref:
    description: "The built commit to start from (default: HEAD)."
    required: false
    default: ""

outputs:
  commit-sha:
    description: "The commit to tag: the pinned commit, or `ref` when nothing referred to the branch."
    value: ${{ steps.pin.outputs.commit-sha }}

runs:
  using: 'composite'
  steps:
    - name: Pin self refs
      id: pin
      shell: bash
      env:
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.repository.default_branch }}
        VERSION: ${{ inputs.version }}
        REF: ${{ inputs.ref }}
      # Run from this action's own checkout as a stdlib-only script (no wads install).
      run: |
        python3 -I "$GITHUB_ACTION_PATH/../../wads/scripts/pin_self_refs.py" \
          --repo "$REPO" --branch "$BRANCH" --version "$VERSION" --ref "${REF:-HEAD}"
