name: "Git Commit"
description: "Commit and push changes to repository - modern, dependency-free"

inputs:
  commit-message:
    description: "Commit message"
    required: true
  add-pattern:
    description: "Pattern for files to add (defaults to all changes)"
    required: false
    default: "."
  push:
    description: "Push changes to remote after committing"
    required: false
    default: "true"
  branch:
    description: "Branch to push to (defaults to current branch)"
    required: false
  ssh-private-key:
    description: "SSH private key for pushing to remote"
    required: false
  git-email:
    description: "Git user email"
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  git-username:
    description: "Git user name"
    required: false
    default: "github-actions[bot]"
  allow-empty:
    description: "Allow empty commits"
    required: false
    default: "false"
  push-rebase-retries:
    description: >-
      How many times to rebase onto the remote branch and retry when a push is
      rejected as non-fast-forward (i.e. the branch moved while the job ran).
      Set to 0 to fail on the first rejection.
    required: false
    default: "3"

outputs:
  commit-sha:
    description: >-
      The commit this action made (or HEAD when there was nothing to commit), as
      it was BEFORE any push-back replay. When the branch moved during the run,
      the push replays the commit onto it under a new sha; this output still
      names the tree that was committed, i.e. what the publish job built and
      uploaded, which is what a release tag must point at (i2mint/wads#161).
    value: ${{ steps.commit.outputs.commit-sha }}

runs:
  using: 'composite'
  steps:
    - name: Configure SSH
      if: ${{ inputs.ssh-private-key }}
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Configure Git
      shell: bash
      run: |
        set -e
        git config --global user.email "${{ inputs.git-email }}"
        git config --global user.name "${{ inputs.git-username }}"
        echo "Configured git as: ${{ inputs.git-username }} <${{ inputs.git-email }}>"

    - name: Commit Changes
      id: commit
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        ADD_PATTERN: ${{ inputs.add-pattern }}
        ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: |
        set -e

        # Add files (unquoted on purpose: the pattern may name several paths)
        echo "Adding files matching pattern: $ADD_PATTERN"
        git add $ADD_PATTERN

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
          if [ "$ALLOW_EMPTY" = "true" ]; then
            echo "Creating empty commit (allow-empty=true)"
            git commit --allow-empty -m "$COMMIT_MESSAGE"
          else
            echo "Skipping commit (no changes and allow-empty=false)"
          fi
        else
          echo "Committing changes"
          git commit -m "$COMMIT_MESSAGE"
        fi
        echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Push Changes
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.branch }}
        REBASE_RETRIES: ${{ inputs.push-rebase-retries }}
      # A package.json / package-lock.json version conflict is resolved with
      # wads' own JSON writer (wads/scripts/sync_version.py --file, standard
      # library only), from this action's checkout ($GITHUB_ACTION_PATH).
      run: |
        set -eo pipefail

        if [ -n "$TARGET_BRANCH" ]; then
          branch="$TARGET_BRANCH"
        else
          branch=$(git rev-parse --abbrev-ref HEAD)
        fi
        current=$(git rev-parse --abbrev-ref HEAD)

        # Replaying only makes sense when the ref we push IS the checked-out
        # branch (the CI publish job's case). If the caller asked to push some
        # other local branch, or HEAD is detached, keep the historical
        # single-attempt behaviour rather than rebasing the wrong thing.
        retries="$REBASE_RETRIES"
        if [ "$branch" != "$current" ] || [ "$current" = "HEAD" ]; then
          retries=0
        fi

        # The first attempt is exactly what this action has always done, so the
        # normal case — nothing else landed on the branch while the job ran — is
        # unchanged. Only the rejection path below is new.
        #
        # Why that path matters (i2mint/wads#81): the CI publish job uploads to
        # PyPI and *then* pushes the version-bump commit back to the default
        # branch. When a second PR is merged during the run, that push is
        # rejected as non-fast-forward, so the release exists on PyPI while its
        # bump commit and tag never land, and the run goes red. The commit being
        # pushed is a tiny generated one (formatting + version bump) that does
        # not touch what a merge touches, so replaying it on top of whatever
        # arrived meanwhile is the correct resolution. Rebase rather than merge,
        # to keep the generated commit as a single tip commit.
        attempt=0
        while true; do
          echo "Pushing to branch: $branch"
          if git push origin "$branch"; then
            exit 0
          fi

          attempt=$((attempt + 1))
          if [ "$attempt" -gt "$retries" ]; then
            echo "::error::Push to '$branch' was rejected and could not be replayed after $retries rebase attempt(s)."
            exit 1
          fi

          echo "Push rejected: '$branch' moved during this run. Rebasing onto it and retrying ($attempt/$retries)."
          git fetch origin "$branch"
          if ! git rebase FETCH_HEAD; then
            # Two generated version bumps conflict on the version line whenever a
            # concurrent release's bump landed while this one ran (i2mint/wads#83),
            # OR a real PR merged and touched the same file(s) while this run's
            # bump/format commit was in flight (i2mint/wads#89 regression: this
            # branch used to resolve by `checkout --theirs`, taking the WHOLE
            # conflicted file from the commit being replayed -- this job's own
            # stale snapshot, captured before the concurrent merge landed. That
            # silently discarded any real content the concurrent merge added,
            # e.g. an entire `[tool.hatch.build]` table, keeping only the
            # version-line change this job actually cared about).
            #
            # The correct resolution needs BOTH properties #83 and #89 each only
            # got half of: the real, concurrently-merged file content must
            # survive (take `--ours` -- during a rebase "ours" is the branch
            # being rebased ONTO, i.e. the just-fetched upstream), and the
            # version number this run just published to PyPI must still land in
            # git (the whole reason #83 exists -- git must not end up recording
            # an older version than what's live). So: keep upstream's content,
            # then reapply only the version-line edit on top of it, reading the
            # target version out of the replayed commit's side of the conflict
            # (git conflict stage 3, ":3:<path>") rather than trusting any
            # particular whole-file side.
            conflicted=$(git diff --name-only --diff-filter=U)
            # The top-level "version" of a package.json / package-lock.json,
            # read from stdin; empty when there is none.
            json_version() {
              python3 -I -c 'import json, sys; v = json.load(sys.stdin).get("version"); print(v if isinstance(v, str) else "")' 2>/dev/null || true
            }
            only_version_files=1
            for path in $conflicted; do
              case "$path" in
                pyproject.toml|setup.cfg|setup.py) ;;
                # [tool.wads.ci.version].sync (i2mint/wads#210): the bump commit
                # also carries the npm twin's version, in its manifest and lockfile.
                # Only when this commit actually bumped it (stage 3 differs from
                # the merge base, stage 1): any other package.json conflict is a
                # real one, and resolving it would put this commit's stale version
                # over upstream's.
                package.json|*/package.json|package-lock.json|*/package-lock.json)
                  ours_bump=$(git show ":3:$path" 2>/dev/null | json_version)
                  base_version=$(git show ":1:$path" 2>/dev/null | json_version)
                  if [ -z "$ours_bump" ] || [ "$ours_bump" = "$base_version" ]; then
                    only_version_files=0
                  fi
                  ;;
                *) only_version_files=0 ;;
              esac
            done
            if [ -n "$conflicted" ] && [ "$only_version_files" = 1 ]; then
              echo "Version file conflict with a concurrent change; keeping upstream content, replaying only the version bump in: $conflicted"
              # The version line lives in [project] (pyproject.toml) or
              # [metadata] (setup.cfg), or before any table in a bare file;
              # another table's `version` key (a tool setting) is not it.
              version_section() {
                case "$1" in
                  setup.cfg) echo metadata ;;
                  *) echo project ;;
                esac
              }
              # Shared awk: the first `version =` line in that section. With
              # nv empty it prints the line's X.Y.Z; otherwise it rewrites that
              # X.Y.Z to nv and prints the whole file.
              version_awk='
                /^[[:space:]]*\[[^]]*\]+[[:space:]]*([#;].*)?\r?$/ {
                  seen = 1
                  insec = ($0 ~ ("^[[:space:]]*\\[[[:space:]]*" sec "[[:space:]]*\\]"))
                }
                !done && (!seen || insec) && /^[[:space:]]*version[[:space:]]*=/ \
                      && match($0, /[0-9]+\.[0-9]+\.[0-9]+/) {
                  done = 1
                  if (nv == "") { print substr($0, RSTART, RLENGTH); exit }
                  $0 = substr($0, 1, RSTART - 1) nv substr($0, RSTART + RLENGTH)
                }
                nv != "" { print }
              '
              # The project's X.Y.Z in file $1's section, read from stdin.
              project_version() {
                awk -v sec="$(version_section "$1")" -v nv="" "$version_awk" || true
              }
              is_json() {
                case "$1" in *.json) return 0 ;; *) return 1 ;; esac
              }
              file_version() {
                if is_json "$1"; then json_version; else project_version "$1"; fi
              }
              for path in $conflicted; do
                new_version=$(git show ":3:$path" 2>/dev/null | file_version "$path" || true)
                if ! git checkout --ours -- "$path" 2>/dev/null; then
                  # Modify/delete conflict: upstream removed the file, so there
                  # is no upstream content to keep (i2mint/wads#98).
                  git rebase --abort || true
                  echo "::error::'$path' was deleted or renamed on 'origin/$branch' while this run bumped it to ${new_version:-a new version}. Resolve by hand."
                  exit 1
                fi
                if [ -n "$new_version" ]; then
                  case "$path" in
                    pyproject.toml|setup.cfg)
                      # Rewrite only the X.Y.Z of the project's version line --
                      # the same line the version was read from -- keeping the
                      # file's own spacing and quoting (i2mint/wads#98: the old
                      # `sed` matched only `version = "X.Y.Z"` verbatim, so any
                      # other valid spelling was a silent no-op, and it also
                      # rewrote every other table's `version = "..."` line).
                      # awk + mv rather than `sed -i`, whose flags differ
                      # between GNU and BSD sed.
                      awk -v sec="$(version_section "$path")" -v nv="$new_version" \
                        "$version_awk" "$path" > "$path.wads-replay"
                      mv -f "$path.wads-replay" "$path"
                      landed=$(project_version "$path" < "$path")
                      if [ "$landed" != "$new_version" ]; then
                        # Pushing now would record an older version in git than
                        # the one this run published (the i2mint/wads#83 desync),
                        # so stop loudly instead.
                        git rebase --abort || true
                        echo "::error::Could not write version $new_version (just published) into '$path' on top of 'origin/$branch' (found '${landed:-no version line}'). Resolve by hand."
                        exit 1
                      fi
                      ;;
                    setup.py)
                      # No fixed version-field syntax to target safely; skip --
                      # the next publish run's own bump step corrects it, and
                      # skipping never loses data (unlike the old --theirs).
                      ;;
                    *.json)
                      # Upstream's file, with this run's version in its version
                      # field(s) (a lockfile's root package too), in the file's
                      # own layout, as `npm version` writes it.
                      sync_script="$GITHUB_ACTION_PATH/../../wads/scripts/sync_version.py"
                      python3 -I "$sync_script" --file "$path" "$new_version" || true
                      landed=$(json_version < "$path")
                      if [ "$landed" != "$new_version" ]; then
                        git rebase --abort || true
                        echo "::error::Could not write version $new_version (just released) into '$path' on top of 'origin/$branch' (found '${landed:-no version}'). Resolve by hand."
                        exit 1
                      fi
                      ;;
                  esac
                else
                  echo "::warning::No X.Y.Z version found in this run's '$path'; kept upstream's version line as is."
                fi
                git add -- "$path"
              done
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "::error::Cannot replay this commit onto the current 'origin/$branch' even after resolving the version files. Resolve by hand."
                exit 1
              fi
            else
              git rebase --abort || true
              echo "::error::Cannot replay this commit onto the current 'origin/$branch': the incoming changes conflict with it. Resolve by hand."
              exit 1
            fi
          fi
        done
