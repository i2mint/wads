name: "Git Commit"
description: "Commit and push changes to repository - modern, dependency-free"

inputs:
  commit-message:
    description: "Commit message"
    required: true
  add-pattern:
    description: "Pattern for files to add (defaults to all changes)"
    required: false
    default: "."
  push:
    description: "Push changes to remote after committing"
    required: false
    default: "true"
  branch:
    description: "Branch to push to (defaults to current branch)"
    required: false
  ssh-private-key:
    description: "SSH private key for pushing to remote"
    required: false
  git-email:
    description: "Git user email"
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  git-username:
    description: "Git user name"
    required: false
    default: "github-actions[bot]"
  allow-empty:
    description: "Allow empty commits"
    required: false
    default: "false"
  push-rebase-retries:
    description: >-
      How many times to rebase onto the remote branch and retry when a push is
      rejected as non-fast-forward (i.e. the branch moved while the job ran).
      Set to 0 to fail on the first rejection.
    required: false
    default: "3"

runs:
  using: 'composite'
  steps:
    - name: Configure SSH
      if: ${{ inputs.ssh-private-key }}
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Configure Git
      shell: bash
      run: |
        set -e
        git config --global user.email "${{ inputs.git-email }}"
        git config --global user.name "${{ inputs.git-username }}"
        echo "Configured git as: ${{ inputs.git-username }} <${{ inputs.git-email }}>"

    - name: Commit Changes
      shell: bash
      run: |
        set -e

        # Add files
        echo "Adding files matching pattern: ${{ inputs.add-pattern }}"
        git add ${{ inputs.add-pattern }}

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
          if [ "${{ inputs.allow-empty }}" = "true" ]; then
            echo "Creating empty commit (allow-empty=true)"
            git commit --allow-empty -m "${{ inputs.commit-message }}"
          else
            echo "Skipping commit (no changes and allow-empty=false)"
            exit 0
          fi
        else
          echo "Committing changes"
          git commit -m "${{ inputs.commit-message }}"
        fi

    - name: Push Changes
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.branch }}
        REBASE_RETRIES: ${{ inputs.push-rebase-retries }}
      run: |
        set -eo pipefail

        if [ -n "$TARGET_BRANCH" ]; then
          branch="$TARGET_BRANCH"
        else
          branch=$(git rev-parse --abbrev-ref HEAD)
        fi
        current=$(git rev-parse --abbrev-ref HEAD)

        # Replaying only makes sense when the ref we push IS the checked-out
        # branch (the CI publish job's case). If the caller asked to push some
        # other local branch, or HEAD is detached, keep the historical
        # single-attempt behaviour rather than rebasing the wrong thing.
        retries="$REBASE_RETRIES"
        if [ "$branch" != "$current" ] || [ "$current" = "HEAD" ]; then
          retries=0
        fi

        # The first attempt is exactly what this action has always done, so the
        # normal case — nothing else landed on the branch while the job ran — is
        # unchanged. Only the rejection path below is new.
        #
        # Why that path matters (i2mint/wads#81): the CI publish job uploads to
        # PyPI and *then* pushes the version-bump commit back to the default
        # branch. When a second PR is merged during the run, that push is
        # rejected as non-fast-forward, so the release exists on PyPI while its
        # bump commit and tag never land, and the run goes red. The commit being
        # pushed is a tiny generated one (formatting + version bump) that does
        # not touch what a merge touches, so replaying it on top of whatever
        # arrived meanwhile is the correct resolution. Rebase rather than merge,
        # to keep the generated commit as a single tip commit.
        attempt=0
        while true; do
          echo "Pushing to branch: $branch"
          if git push origin "$branch"; then
            exit 0
          fi

          attempt=$((attempt + 1))
          if [ "$attempt" -gt "$retries" ]; then
            echo "::error::Push to '$branch' was rejected and could not be replayed after $retries rebase attempt(s)."
            exit 1
          fi

          echo "Push rejected: '$branch' moved during this run. Rebasing onto it and retrying ($attempt/$retries)."
          git fetch origin "$branch"
          if ! git rebase FETCH_HEAD; then
            git rebase --abort || true
            echo "::error::Cannot replay this commit onto the current 'origin/$branch': the incoming changes conflict with it. Resolve by hand."
            exit 1
          fi
        done
