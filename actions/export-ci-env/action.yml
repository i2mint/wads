name: 'Export CI Environment from pyproject.toml'
description: >-
  Write the pyproject-declared environment variables into $GITHUB_ENV. Exports
  only the values a repo's [tool.wads.ci.env] declares (plus literal defaults),
  resolving each name against secrets first (including the WADS_CI_SECRETS_JSON
  transport blob, whose extracted values are re-masked) and repository
  variables second, and fails with a clear message if a required value is
  missing. The full secrets/vars contexts are passed via toJSON so no
  per-secret enumeration is needed here.
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  required:
    description: 'JSON array of required env-var names (read-ci-config env-required).'
    required: false
    default: '[]'
  test:
    description: 'JSON array of test env-var names (read-ci-config env-test).'
    required: false
    default: '[]'
  extra:
    description: 'JSON array of optional env-var names (read-ci-config env-extra).'
    required: false
    default: '[]'
  defaults:
    description: 'JSON object of literal default env vars (read-ci-config env-defaults).'
    required: false
    default: '{}'
  aliases:
    description: 'JSON object mapping env-var name -> secret name (read-ci-config env-aliases).'
    required: false
    default: '{}'
  secrets-json:
    # NOTE: do not write a GitHub expression literally here — the manifest
    # loader evaluates expressions even inside description strings, and the
    # `secrets` context is not available in a composite action manifest.
    description: 'The secrets context serialized as JSON by the caller (toJSON of the secrets context).'
    required: true
  vars-json:
    description: >-
      The caller's configuration-variables context serialized as JSON (toJSON
      of the vars context). Declared env vars with no backing secret fall back
      to a same-named repository variable.
    required: false
    default: '{}'
  always-required:
    description: >-
      JSON array of env-var names the WORKFLOW itself requires (merged with the
      repo-declared required_envvars), e.g. PYPI_PASSWORD in the publish job.
    required: false
    default: '[]'

runs:
  using: 'composite'
  steps:
    - name: Set up Python for env export
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Export configured environment
      shell: bash
      # The script runs straight from this action's own files: the runner
      # fetches the whole i2mint/wads repository at the ref this action was
      # `uses:`-referenced at, so workflow, action and script are always the
      # same version (a wads branch can be tested end to end without
      # publishing anything). `python -I -S` ignores site-packages, the user
      # site and PYTHONPATH: the script needs only the standard library, so
      # no installed package is imported in this step.
      env:
        WADS_ENV_REQUIRED: ${{ inputs.required }}
        WADS_ENV_TEST: ${{ inputs.test }}
        WADS_ENV_EXTRA: ${{ inputs.extra }}
        WADS_ENV_DEFAULTS: ${{ inputs.defaults }}
        WADS_ENV_ALIASES: ${{ inputs.aliases }}
        WADS_SECRETS_JSON: ${{ inputs.secrets-json }}
        WADS_VARS_JSON: ${{ inputs.vars-json }}
        WADS_ENV_ALWAYS_REQUIRED: ${{ inputs.always-required }}
      run: python -I -S "$GITHUB_ACTION_PATH/../../wads/scripts/export_ci_env.py"
