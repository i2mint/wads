# Reusable NPM CI workflow (wads).
#
# Consumers call this from their own .github/workflows/npm-ci.yml stub:
#
#   jobs:
#     npm-ci:
#       uses: i2mint/wads/.github/workflows/npm-ci.yml@master
#       with:
#         package-dir: js
#
# npm auth: TRUSTED PUBLISHING (OIDC) ONLY — never add an NPM_TOKEN secret.
#   On npmjs.com, each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo of the CONSUMER repo, and the CONSUMER'S stub filename (e.g.
#   npm-ci.yml), NOT this file: npm validates the calling workflow when the
#   publish runs inside a workflow_call. CLI equivalent (npm >= 11.15, 2FA):
#     npm trust github <pkg> --file <stub>.yml --repo <owner>/<repo> --allow-publish -y
#   The package must already exist on npm (first publish: local `npm publish`).
#   The NPM_TOKEN secret input below is kept only so old stubs still parse.
#
# Design (mirrors the Python uv-ci.yml SSOT model):
#   - ALL configuration lives in the consumer's <package-dir>/package.json under
#     the namespaced top-level "wads" key (wads.ci.*). npm ignores unknown keys.
#   - `validate` runs lint/test/build on every push/PR (matrix over node).
#   - `publish` is OPT-IN: it runs only when wads.ci.publish.enabled is true AND
#     the push is to the default branch AND the head commit message contains the
#     publish marker (default "[publish-npm]" — deliberately distinct from any
#     Python publish trigger).
#   - Publish isolation (#114): a credential-free `pack` job installs, builds
#     and packs; only `publish` can mint the OIDC token, and it runs no repo
#     code (`npm publish <tarball> --ignore-scripts`).
#   - Publishing uses npm OIDC trusted publishing by default (no long-lived
#     token; see "npm auth" above).
#   - A pre-publish "version already on registry?" guard makes the job
#     idempotent (no 403 on re-run); there is NO auto-bump on the JS side.
#   - Package manager: npm by default. pnpm is supported and is selected either
#     explicitly (wads.ci.packageManager = "pnpm") or auto-detected from a
#     pnpm-lock.yaml in the package dir. pnpm consumers should declare a
#     "packageManager": "pnpm@x.y.z" field in their package.json (pnpm's own
#     convention) — the pnpm setup reads the version from there. npm consumers
#     are unaffected (no pnpm-lock.yaml → npm).
#   - wads.ci.trigger (mirrors [tool.wads.ci.trigger] on the Python side):
#     mode "auto" (default) runs on every call, as always. mode "on-demand"
#     means NOTHING RUNS UNLESS ASKED — validate/publish only run when the
#     commit SUBJECT contains wads.ci.trigger.runCiMarker (default "[run ci]"),
#     or the run is a manual workflow_dispatch (always allowed). The caller
#     stub's own `on:`/job-level `if:` is a separate, zero-cost pre-filter (see
#     wads/data/github_ci_npm_stub.yml); this workflow's gate below is the real
#     decision, re-checked against the extracted subject so a marker quoted
#     only in a squash-merged PR body costs one setup job and runs nothing
#     else. Local equivalent: `npm run ci-local` (lint, typecheck, test, build
#     — see README).

name: NPM CI

on:
  workflow_call:
    inputs:
      package-dir:
        description: "Directory containing package.json (relative to repo root)."
        type: string
        default: "js"
    secrets:
      NPM_TOKEN:
        description: "DEPRECATED, do not pass. npm auth token, used only if OIDC trusted publishing is not configured. See the trusted-publishing note in the header."
        required: false

# Read-only by default; only the `publish` job adds id-token: write (#114).
# The validate and pack jobs run the repo's code and must not be able to mint
# an OIDC token, which npm trusted publishing would accept.
permissions:
  contents: read

jobs:
  setup:
    name: Read wads.ci config from package.json
    runs-on: ubuntu-latest
    outputs:
      package_manager: ${{ steps.cfg.outputs.package_manager }}
      node_versions: ${{ steps.cfg.outputs.node_versions }}
      publish_node: ${{ steps.cfg.outputs.publish_node }}
      lint_command: ${{ steps.cfg.outputs.lint_command }}
      test_command: ${{ steps.cfg.outputs.test_command }}
      build_command: ${{ steps.cfg.outputs.build_command }}
      publish_enabled: ${{ steps.cfg.outputs.publish_enabled }}
      publish_marker: ${{ steps.cfg.outputs.publish_marker }}
      commit_subject: ${{ steps.commit.outputs.subject }}
      registry: ${{ steps.cfg.outputs.registry }}
      provenance: ${{ steps.cfg.outputs.provenance }}
      access: ${{ steps.cfg.outputs.access }}
      trigger_mode: ${{ steps.cfg.outputs.trigger_mode }}
      run_ci_marker: ${{ steps.cfg.outputs.run_ci_marker }}
    steps:
      # The publish gate below matches the commit SUBJECT (first line), never
      # the whole message: a squash-merge folds the entire PR BODY into the
      # squash commit message, so a `contains()` over the full message fires on
      # a PR that merely writes ABOUT the marker. The message reaches bash only
      # through the environment, so its quotes and newlines cannot become shell
      # syntax. See the same note in uv-ci.yml.
      - name: Extract commit subject
        id: commit
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          subject="${subject%$'\r'}"
          delimiter="wads-subject-${RANDOM}${RANDOM}${RANDOM}"
          {
            printf 'subject<<%s\n' "$delimiter"
            printf '%s\n' "$subject"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
          printf 'commit subject: %s\n' "$subject"

      - uses: actions/checkout@v4
      - name: Parse package.json wads.ci
        id: cfg
        working-directory: ${{ inputs.package-dir }}
        run: |
          read_cfg() {
            node -e "
              const fs = require('fs');
              const p = require('./package.json');
              const ci = (p.wads && p.wads.ci) || {};
              const pub = ci.publish || {};
              const trig = ci.trigger || {};
              // Explicit packageManager wins; else auto-detect pnpm via its
              // lockfile; else npm. Existing npm repos (no field, no
              // pnpm-lock.yaml) resolve to npm — unchanged behavior.
              let pm = ci.packageManager || '';
              if (!pm) pm = fs.existsSync('pnpm-lock.yaml') ? 'pnpm' : 'npm';
              // Fails loudly (non-zero exit) on an invalid mode, mirroring
              // CIConfig.trigger_mode on the Python side — a typo must not
              // silently fall back to auto.
              const mode = trig.mode || 'auto';
              if (mode !== 'auto' && mode !== 'on-demand') {
                throw new Error(\`wads.ci.trigger.mode must be 'auto' or 'on-demand', got '\${mode}'\`);
              }
              const marker = trig.runCiMarker || '[run ci]';
              if (!marker || /\\n/.test(marker)) {
                throw new Error('wads.ci.trigger.runCiMarker must be a non-empty, single-line string');
              }
              const out = {
                package_manager: pm,
                node_versions: JSON.stringify(ci.nodeVersions || ['20','22','24']),
                publish_node: String(ci.publishNode || '24'),
                lint_command: ci.lintCommand || 'npm run lint --if-present',
                test_command: ci.testCommand || 'npm test --if-present',
                build_command: ci.buildCommand || 'npm run build --if-present',
                publish_enabled: String(pub.enabled === true),
                publish_marker: pub.marker || '[publish-npm]',
                registry: pub.registry || 'https://registry.npmjs.org',
                provenance: String(pub.provenance !== false),
                access: pub.access || 'public',
                trigger_mode: mode,
                run_ci_marker: marker,
              };
              for (const [k,v] of Object.entries(out)) console.log(k+'='+v);
            "
          }
          read_cfg >> "$GITHUB_OUTPUT"

  # TRIGGER GATE (mirrors uv-ci.yml). trigger_mode == 'auto' (default) makes
  # this always true. 'on-demand' means nothing runs unless the commit SUBJECT
  # carries run_ci_marker, or it's a manual workflow_dispatch (always
  # allowed). Publish carries the same clause, ANDed with its own opt-in gate.
  validate:
    name: Validate (node ${{ matrix.node }})
    needs: setup
    if: >-
      needs.setup.outputs.trigger_mode != 'on-demand' ||
      github.event_name == 'workflow_dispatch' ||
      contains(needs.setup.outputs.commit_subject, needs.setup.outputs.run_ci_marker)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.setup.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect lockfile
        id: lock
        working-directory: ${{ inputs.package-dir }}
        run: |
          if [ "${{ needs.setup.outputs.package_manager }}" = "pnpm" ]; then
            LOCKFILE=pnpm-lock.yaml
          else
            LOCKFILE=package-lock.json
          fi
          if [ -f "$LOCKFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $LOCKFILE committed in '${{ inputs.package-dir }}'; installing without a frozen lockfile and skipping the dependency cache. Commit a lockfile for reproducible, cached installs."
          fi
      - name: Setup pnpm
        if: needs.setup.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          # Read the pnpm version from the package's own packageManager field.
          package_json_file: ${{ inputs.package-dir }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # The dependency cache keys off the lockfile; only enable it when one
          # is committed (setup-node errors if cache is on but the lockfile is
          # absent -- e.g. a freshly generated project, issue #41).
          cache: ${{ steps.lock.outputs.present == 'true' && needs.setup.outputs.package_manager || '' }}
          cache-dependency-path: ${{ inputs.package-dir }}/${{ needs.setup.outputs.package_manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install
        working-directory: ${{ inputs.package-dir }}
        run: |
          if [ "${{ needs.setup.outputs.package_manager }}" = "pnpm" ]; then
            if [ "${{ steps.lock.outputs.present }}" = "true" ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install --no-frozen-lockfile
            fi
          else
            npm ci || npm install
          fi
      - name: Lint
        working-directory: ${{ inputs.package-dir }}
        run: ${{ needs.setup.outputs.lint_command }}
      - name: Test
        working-directory: ${{ inputs.package-dir }}
        run: ${{ needs.setup.outputs.test_command }}
      - name: Build
        working-directory: ${{ inputs.package-dir }}
        run: ${{ needs.setup.outputs.build_command }}

  # PUBLISH ISOLATION (#114). Publishing is split in two jobs:
  #   pack    - installs, builds and packs the package (running its lifecycle
  #             scripts) with NO publish credential: no id-token, no npm token.
  #   publish - holds the credential (OIDC id-token; the deprecated NPM_TOKEN
  #             fallback) and runs NO repo code: no checkout, no install, and
  #             `npm publish <tarball> --ignore-scripts`.
  # Before, `npm publish` ran prepack/prepublishOnly/prepare and every
  # dependency's install script in the job that could mint the OIDC token.
  # Both jobs carry the same opt-in gate: enabled in package.json AND push to
  # default branch AND marker present, AND (in on-demand mode) the same push
  # also carries run_ci_marker — publish never fires from a workflow_dispatch
  # (it only runs on `push`, unlike the Python side's single validate+publish
  # job), so the trigger gate here only needs the marker branch.
  pack:
    name: Pack for npm
    needs: [setup, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      needs.setup.outputs.publish_enabled == 'true' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(needs.setup.outputs.commit_subject, needs.setup.outputs.publish_marker) &&
      (needs.setup.outputs.trigger_mode != 'on-demand' ||
       contains(needs.setup.outputs.commit_subject, needs.setup.outputs.run_ci_marker))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        if: needs.setup.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.package-dir }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.publish_node }}
      - name: Install
        working-directory: ${{ inputs.package-dir }}
        run: |
          if [ "${{ needs.setup.outputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          else
            npm ci || npm install
          fi
      - name: Build
        working-directory: ${{ inputs.package-dir }}
        run: ${{ needs.setup.outputs.build_command }}
      - name: Pack
        working-directory: ${{ inputs.package-dir }}
        run: |
          # pnpm pack rewrites `workspace:`/`catalog:` specifiers; npm pack
          # is the npm path. Either way the tarball is what gets published.
          DEST="$RUNNER_TEMP/npm-pack"
          mkdir -p "$DEST"
          # prepublishOnly runs here, since publish uses --ignore-scripts;
          # prepack/prepare/postpack run as part of pack itself.
          if [ "${{ needs.setup.outputs.package_manager }}" = "pnpm" ]; then
            pnpm run --if-present prepublishOnly
            pnpm pack --pack-destination "$DEST"
          else
            npm run prepublishOnly --if-present
            npm pack --pack-destination "$DEST"
          fi
          (cd "$DEST" && ls -- *.tgz > publish-order.txt && cat publish-order.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-pack
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [setup, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance; THIS job only
    if: >-
      needs.setup.outputs.publish_enabled == 'true' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(needs.setup.outputs.commit_subject, needs.setup.outputs.publish_marker) &&
      (needs.setup.outputs.trigger_mode != 'on-demand' ||
       contains(needs.setup.outputs.commit_subject, needs.setup.outputs.run_ci_marker))
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.publish_node }}
          registry-url: ${{ needs.setup.outputs.registry }}
      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          # Trusted publishing needs npm >= 11.5.1 and node >= 22.14.
          if ! node -e "const [a,b]=process.versions.node.split('.').map(Number);process.exit(a>22||(a===22&&b>=14)?0:1)"; then
            echo "::error::npm trusted publishing needs Node >= 22.14 (got $(node --version)). Raise wads.ci.publishNode (default 24)."
            exit 1
          fi
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            # Exact pin, from the public registry, no scripts: this job can mint
            # the OIDC token.
            npm install -g npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org/
          fi
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-pack
      - name: Publish tarballs (no scripts run)
        env:
          # Omitted/empty under OIDC trusted publishing; used only as a fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ needs.setup.outputs.provenance }}
          ACCESS: ${{ needs.setup.outputs.access }}
          REGISTRY: ${{ needs.setup.outputs.registry }}
          # The artifact was made by the pack job, which ran the repo's code, so
          # nothing in it is trusted beyond the tarballs' bytes. This check reads
          # a tarball's package.json as data and refuses a name npm would parse
          # as an option, and any publishConfig key that would change where or
          # how npm sends the credential (proxy, registry, TLS, auth...): npm
          # applies a tarball's publishConfig as config (#114 review).
          MANIFEST_CHECK: |
            // Read the manifest with npm's OWN reader (pacote), so the check
            // sees exactly what `npm publish` will use, whatever the tarball's
            // layout (#114 review: npm takes the last */package.json member).
            const path = require('path');
            const { execFileSync } = require('child_process');
            const npmRoot = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
            const pacote = require(path.join(npmRoot, 'npm', 'node_modules', 'pacote'));
            const [tgz, registry] = process.argv.slice(1);
            const fail = (msg) => { console.error('::error::' + msg); process.exit(1); };
            pacote.manifest('file:' + path.resolve(tgz), { fullMetadata: true }).then((m) => {
            const NAME = /^(@[A-Za-z0-9~-][A-Za-z0-9._~-]*\/)?[A-Za-z0-9~-][A-Za-z0-9._~-]*$/;
            if (typeof m.name !== 'string' || !NAME.test(m.name)) fail('invalid package name in tarball: ' + JSON.stringify(m.name));
            if (typeof m.version !== 'string' || !/^\d+\.\d+\.\d+([-+][0-9A-Za-z.+-]*)?$/.test(m.version)) fail('invalid version in tarball: ' + JSON.stringify(m.version));
            const SAFE = new Set(['access', 'tag', 'provenance', 'directory', 'linkDirectory', 'executableFiles',
              'main', 'module', 'types', 'typings', 'exports', 'bin', 'browser', 'typesVersions', 'imports']);
            const strip = (u) => String(u).replace(/\/+$/, '');
            for (const key of Object.keys(m.publishConfig || {})) {
              if (key === 'registry' && strip(m.publishConfig.registry) === strip(registry)) continue;
              if (!SAFE.has(key)) fail(m.name + ': publishConfig.' + key + ' is not allowed in CI publishing');
            }
            console.log(m.name + ' ' + m.version);
            }, (err) => fail('cannot read the manifest of ' + tgz + ': ' + err.message));
        run: |
          ART="$RUNNER_TEMP/npm-pack"
          # The artifact must hold exactly publish-order.txt and the tarballs it
          # lists, each a plain file name: no .npmrc, package.json, paths, options.
          mapfile -t TGZS < "$ART/publish-order.txt"
          [ "${#TGZS[@]}" -gt 0 ] || { echo "::error::nothing to publish"; exit 1; }
          for f in "${TGZS[@]}"; do
            if ! [[ "$f" =~ ^[A-Za-z0-9_][A-Za-z0-9._+-]*\.tgz$ ]] || [ ! -f "$ART/$f" ]; then
              echo "::error::unexpected entry in publish-order.txt"; exit 1
            fi
          done
          EXPECTED=$(printf '%s\n' publish-order.txt "${TGZS[@]}" | sort)
          ACTUAL=$(cd "$ART" && ls -A | sort)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::the npm-pack artifact holds files besides the listed tarballs"; exit 1
          fi
          PROV=""
          if [ "$PROVENANCE" = "true" ]; then PROV="--provenance"; fi
          # npm runs in an empty directory, so no project config is picked up.
          WORK=$(mktemp -d)
          cd "$WORK"
          for f in "${TGZS[@]}"; do
            # Defense in depth only (GNU tar can stop listing early); the real
            # guard is MANIFEST_CHECK, which reads the manifest with npm's own
            # pacote. A plain npm tarball: every member under package/, one
            # root package.json (npm strips the first path component of every
            # member, so anything else could shadow the manifest).
            MEMBERS=$(tar -tzf "$ART/$f")
            if printf '%s\n' "$MEMBERS" | grep -qv '^package/' \
               || [ "$(printf '%s\n' "$MEMBERS" | grep -cE '^package(/+\.?)*/+package\.json$')" != 1 ] \
               || ! printf '%s\n' "$MEMBERS" | grep -qx 'package/package.json'; then
              echo "::error::$f is not a plain npm tarball"; exit 1
            fi
            read -r NAME VER < <(node -e "$MANIFEST_CHECK" "$ART/$f" "$REGISTRY")
            [ -n "$VER" ] || exit 1
            # Idempotent: skip a version already on the registry (no 403 on
            # re-run, no auto-bump), as before.
            if npm view -- "$NAME@$VER" version >/dev/null 2>&1; then
              echo "Version $NAME@$VER already published; skipping."
              continue
            fi
            npm publish "$ART/$f" --ignore-scripts $PROV --access "$ACCESS"
          done
