# wads' own CI: it calls the reusable workflow that THIS repo hosts, at this commit
# (`./.github/workflows/uv-ci.yml`), so a PR that edits uv-ci.yml runs its own version
# (i2mint/wads#198). Consumers call `i2mint/wads/.github/workflows/uv-ci.yml@master`
# through the stub wads ships (wads/data/github_ci_uv_stub.yml); keep this file off
# `wads-migrate ci-to-stub` / `fleet-stub`, which would point it back at @master.
#
# All configuration comes from pyproject.toml [tool.wads.ci.*]. The permissions below
# are the most any job in uv-ci.yml requests (GitHub checks them at parse time, even for
# skipped jobs): contents: write (publish push-back), pages: write and id-token: write
# (Pages).
name: Continuous Integration
on: [push, pull_request]
jobs:
  ci:
    # wads dogfoods its own reusable workflow AT THIS COMMIT (not @master, as the
    # stub it ships does), so a PR that edits uv-ci.yml runs its own version in PR
    # CI (i2mint/wads#198). The actions it calls still float on @master: a PR that
    # edits an action needs the throwaway-branch check in skills/wads-dev-workflow.
    uses: ./.github/workflows/uv-ci.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    # Named pass-through, as in the stub consumers get (a called workflow sees only
    # the secrets passed to it); PYPI_PASSWORD must be set for the publish job.
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
